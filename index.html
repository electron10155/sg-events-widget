<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1c1c1e">
<meta name="description" content="新加坡免费/低价活动每日精选">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SG Events">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SG Events · 每日精选</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #000000;
  --card: #1c1c1e;
  --card-2: #2c2c2e;
  --text: #ffffff;
  --text-sec: rgba(255,255,255,0.65);
  --text-thi: rgba(255,255,255,0.40);
  --accent: #FF9F0A;
  --radius: 20px;
  --radius-sm: 14px;
}

html, body {
  width: 100%;
  height: 100%;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
  background: var(--bg);
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  letter-spacing: -0.01em;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* === Desktop Pet Frame === */
.pet {
  width: 100%;
  height: 100%;
  background: var(--card);
  border-radius: 0;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ============================================================
   Mode switching: compact (desktop mini) / full (expanded)
   ============================================================ */
body.mode-compact { padding: 0; }
body.mode-compact .pet {
  width: 100%;
  height: 100%;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: border-radius 0.25s ease;
}
body.mode-full {
  align-items: flex-start;
  justify-content: flex-start;
}
body.mode-full .pet {
  height: auto;
  min-height: 0;
}
body.mode-compact .full-view { display: none; }
body.mode-full .compact-view { display: none; }

/* ============================================================
   COMPACT VIEW (horizontal desktop widget like Apple Reminders)
   ============================================================ */
.compact-view {
  display: flex;
  flex-direction: row;
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

.cp-left {
  width: 42%;
  min-width: 140px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}
/* Promotional image mode: hide emoji + dot pattern, darken for badge legibility */
.cp-left.has-image .cp-icon-bg,
.cp-left.has-image .cp-pattern-h { display: none; }
.cp-left.has-image::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    linear-gradient(to right, rgba(0,0,0,0.25), rgba(0,0,0,0) 45%),
    linear-gradient(to bottom, rgba(0,0,0,0.20), rgba(0,0,0,0) 40%);
}
.cp-left::after {
  content: '';
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 40%;
  background: linear-gradient(to right, transparent, var(--card));
}
.cp-icon-bg {
  font-size: 52px;
  filter: drop-shadow(0 4px 18px rgba(0,0,0,0.35));
  z-index: 1;
}
.cp-pattern-h {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0.10;
  background-image: radial-gradient(circle at 2px 2px, #fff 1px, transparent 0);
  background-size: 14px 14px;
}
.cp-price-h {
  position: absolute;
  top: 10px; left: 10px;
  z-index: 2;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  backdrop-filter: blur(6px);
  background: rgba(0,0,0,0.35);
  color: #fff;
}
.cp-hot-h {
  position: absolute;
  bottom: 10px; left: 10px;
  z-index: 2;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255,55,95,0.30);
  color: #FF375F;
  backdrop-filter: blur(6px);
}

.cp-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 14px 16px 12px;
  position: relative;
  z-index: 1;
  background: var(--card);
}

.cp-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  margin-bottom: 8px;
}
.cp-brand {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
}
.cp-flag { font-size: 14px; }
.cp-date {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-thi);
  background: var(--card-2);
  padding: 3px 8px;
  border-radius: 8px;
  white-space: nowrap;
}

.cp-stage {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.cp-events { position: relative; width: 100%; height: 100%; }

.cp-event {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  display: flex;
  flex-direction: column;
  opacity: 0;
  transform: translateX(10px);
  transition: opacity 0.45s ease, transform 0.45s ease;
  pointer-events: none;
}
.cp-event.active {
  opacity: 1;
  transform: translateX(0);
  pointer-events: auto;
}

.cp-body {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
}
.cp-cat {
  font-size: 9px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.cp-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
  letter-spacing: -0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cp-row {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--text-sec);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cp-row .ico { flex-shrink: 0; font-size: 10px; }

.cp-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  margin-top: 8px;
}
.cp-dots { display: flex; gap: 5px; align-items: center; }
.cp-nav { display: flex; align-items: center; gap: 7px; }
.cp-nav-btn {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--card-2);
  border: none;
  color: var(--text-sec);
  font-size: 13px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-family: inherit;
  padding: 0 0 1px;
  transition: all 0.15s ease;
  flex-shrink: 0;
}
.cp-nav-btn:hover { background: var(--accent); color: #000; }
.cp-nav-btn:active { transform: scale(0.92); }
.cp-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.22);
  transition: all 0.25s ease;
  cursor: pointer;
}
.cp-dot.active {
  width: 14px;
  border-radius: 3px;
  background: var(--accent);
}
.cp-hint {
  font-size: 9px;
  color: var(--text-thi);
  white-space: nowrap;
}

/* ============================================================
   FULL VIEW (expanded page)
   ============================================================ */
.full-view {
  display: flex;
  flex-direction: column;
}

/* === Header === */
.pet-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 14px;
  background: rgba(0,0,0,0.3);
}
.pet-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pet-flag { font-size: 20px; }
.pet-title { font-size: 16px; font-weight: 700; color: var(--text); }
.pet-header-right { display: flex; align-items: center; gap: 8px; }
.pet-date {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-thi);
  background: var(--card-2);
  padding: 5px 12px;
  border-radius: 10px;
}
.collapse-btn {
  background: var(--card-2);
  border: none;
  color: var(--text-sec);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  padding: 5px 12px;
  border-radius: 10px;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.collapse-btn:hover { background: var(--accent); color: #000; }

/* === Day Tabs === */
.day-tabs {
  display: flex;
  gap: 5px;
  padding: 10px 14px 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar { display: none; }
.day-tab {
  flex-shrink: 0;
  border: none;
  background: var(--card-2);
  color: var(--text-thi);
  font-size: 11px;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.day-tab:hover { color: var(--text-sec); }
.day-tab.active {
  background: var(--accent);
  color: #000;
}

/* === Carousel === */
.carousel {
  position: relative;
  height: 410px;
  overflow: hidden;
}

.slides {
  position: relative;
  width: 100%;
  height: 100%;
}

.slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  opacity: 0;
  transform: scale(0.97);
  transition: opacity 0.5s ease, transform 0.5s ease;
  pointer-events: none;
  display: flex;
  flex-direction: column;
}
.slide.active {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

/* Slide visual top */
.slide-visual {
  height: 150px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background-size: cover;
  background-position: center;
}
.slide-visual::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 55%;
  background: linear-gradient(to bottom, transparent, var(--card));
}
.slide-visual.has-image .slide-icon,
.slide-visual.has-image .slide-pattern { display: none; }
.slide-visual.has-image::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 35%;
  background: linear-gradient(to bottom, rgba(0,0,0,0.30), rgba(0,0,0,0));
}
.slide-icon {
  font-size: 52px;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3));
  z-index: 1;
}
.slide-pattern {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0.12;
  background-image: radial-gradient(circle at 2px 2px, #fff 1px, transparent 0);
  background-size: 20px 20px;
}

/* Slide content */
.slide-content {
  flex: 1;
  padding: 0 20px 16px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  scrollbar-width: none;
}
.slide-content::-webkit-scrollbar { display: none; }

.slide-badges {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.badge {
  font-size: 10px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 7px;
  letter-spacing: 0.02em;
}
.badge-cat {
  background: rgba(255,255,255,0.12);
  color: var(--text);
}
.badge-price-free {
  background: rgba(48,209,88,0.2);
  color: #30D158;
}
.badge-price-low {
  background: rgba(255,159,10,0.2);
  color: #FF9F0A;
}
.badge-price-paid {
  background: rgba(255,69,58,0.2);
  color: #FF453A;
}
.badge-hot {
  background: rgba(255,55,95,0.2);
  color: #FF375F;
}

.slide-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}

.slide-info {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}
.info-row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 12px;
  color: var(--text-sec);
  line-height: 1.4;
}
.info-icon { font-size: 11px; flex-shrink: 0; margin-top: 1px; }

.slide-desc {
  font-size: 12px;
  color: var(--text-sec);
  line-height: 1.5;
  margin-bottom: 12px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.slide-link {
  margin-top: auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: var(--card-2);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  padding: 10px 16px;
  border-radius: 12px;
  transition: all 0.2s ease;
  font-family: inherit;
}
.slide-link:hover {
  background: var(--accent);
  color: #000;
}

/* === Navigation === */
.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  transition: all 0.2s ease;
  opacity: 0;
}
.carousel:hover .nav-arrow { opacity: 0.85; }
.nav-arrow:hover { background: rgba(0,0,0,0.8); }
.nav-prev { left: 8px; }
.nav-next { right: 8px; }

/* === Progress bar === */
.progress-bar {
  position: absolute;
  top: 0; left: 0;
  height: 2px;
  background: var(--accent);
  transition: width 0.1s linear;
  z-index: 11;
}

/* === Dots === */
.dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 8px 0 6px;
  background: var(--card);
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.2);
  cursor: pointer;
  transition: all 0.2s ease;
}
.dot.active {
  width: 18px;
  border-radius: 4px;
  background: var(--accent);
}

/* === Footer === */
.pet-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px 16px;
  background: rgba(0,0,0,0.2);
}
.footer-left {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--text-thi);
}
.expand-btn {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  padding: 4px 10px;
  border-radius: 8px;
  transition: all 0.15s;
}
.expand-btn:hover { background: rgba(255,159,10,0.12); }
.update-badge {
  font-size: 9px;
  font-weight: 600;
  color: #30D158;
  background: rgba(48,209,88,0.12);
  padding: 2px 7px;
  border-radius: 6px;
  white-space: nowrap;
}
.update-badge.offline { color: var(--text-thi); background: rgba(255,255,255,0.06); }

/* === Expanded View === */
.expanded-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(20px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.expanded-overlay.show { display: flex; }
.expanded-panel {
  width: 420px;
  max-height: 85vh;
  background: var(--card);
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.expanded-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.expanded-title { font-size: 15px; font-weight: 700; color: var(--text); }
.close-btn {
  background: var(--card-2);
  border: none;
  color: var(--text-sec);
  width: 28px; height: 28px;
  border-radius: 50%;
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}
.expanded-list {
  max-height: 60vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.2) transparent;
}
.expanded-list::-webkit-scrollbar { width: 4px; }
.expanded-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
.exp-item {
  padding: 14px 20px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  text-decoration: none;
  color: inherit;
  display: block;
  transition: background 0.15s;
}
.exp-item:hover { background: var(--card-2); }
.exp-item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.exp-item-title { font-size: 13px; font-weight: 600; color: var(--text); flex: 1; line-height: 1.3; }
.exp-item-meta { font-size: 11px; color: var(--text-thi); margin-top: 5px; line-height: 1.4; }

/* === Responsive === */
@media (max-width: 420px) {
  body { padding: 0; }
  .pet { width: 100%; height: 100%; border-radius: 0; }
}
@media (display-mode: standalone) and (max-width: 500px) {
  .collapse-btn { display: none; }
}

/* === Loading shimmer === */
@keyframes shimmer {
  0% { opacity: 0.4; }
  50% { opacity: 0.8; }
  100% { opacity: 0.4; }
}
.loading { animation: shimmer 1.5s infinite; }
</style>
</head>
<body class="mode-compact">

<div class="pet" id="pet">

  <!-- ============ COMPACT VIEW (horizontal desktop widget) ============ -->
  <div class="compact-view" id="compactView">
    <div class="cp-left" id="cpLeft">
      <div class="cp-pattern-h"></div>
      <div class="cp-icon-bg" id="cpIcon">🇸🇬</div>
      <span class="cp-price-h" id="cpPrice">—</span>
    </div>
    <div class="cp-right">
      <div class="cp-header">
        <div class="cp-brand">
          <span class="cp-flag">🇸🇬</span>
          <span>今日精选</span>
        </div>
        <span class="cp-date" id="cpDate">今天</span>
      </div>
      <div class="cp-stage">
        <div class="cp-events" id="cpEvents">
          <div class="cp-event active loading" style="justify-content:center;color:rgba(255,255,255,0.4);font-size:12px;">加载中…</div>
        </div>
      </div>
      <div class="cp-footer">
        <div class="cp-nav">
          <button class="cp-nav-btn" id="cpPrev" title="上一个">‹</button>
          <div class="cp-dots" id="cpDots"></div>
          <button class="cp-nav-btn" id="cpNext" title="下一个">›</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ FULL VIEW (expanded page) ============ -->
  <div class="full-view">
    <!-- Header -->
    <div class="pet-header">
      <div class="pet-brand">
        <span class="pet-flag">🇸🇬</span>
        <span class="pet-title">每日精选</span>
      </div>
      <div class="pet-header-right">
        <span class="pet-date" id="dateLabel">—</span>
        <button class="collapse-btn" id="collapseBtn" title="收起为迷你小组件">⤡ 收起</button>
      </div>
    </div>

    <!-- Day Tabs -->
    <div class="day-tabs" id="dayTabs"></div>

    <!-- Carousel -->
    <div class="carousel" id="carousel">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
      <div class="slides" id="slides"></div>
      <button class="nav-arrow nav-prev" id="navPrev">‹</button>
      <button class="nav-arrow nav-next" id="navNext">›</button>
    </div>

    <!-- Dots -->
    <div class="dots" id="dots"></div>

    <!-- Footer -->
    <div class="pet-footer">
      <div class="footer-left">
        <span id="footerText">滑动浏览 · 点击查看官网</span>
        <span class="update-badge offline" id="updateBadge" style="display:none;"></span>
      </div>
      <button class="expand-btn" id="installBtn" style="display:none;" title="安装到桌面">📲 安装</button>
      <button class="expand-btn" id="expandBtn">全部活动 →</button>
    </div>
  </div>
</div>

<!-- Expanded Panel -->
<div class="expanded-overlay" id="expandedOverlay">
  <div class="expanded-panel">
    <div class="expanded-header">
      <span class="expanded-title" id="expandedTitle">全部活动</span>
      <button class="close-btn" id="closeExpanded">✕</button>
    </div>
    <div class="expanded-list" id="expandedList"></div>
  </div>
</div>

<script>
// ============================================================
//  用户偏好画像
// ============================================================
const USER_PREFS = {
  categories: ['music', 'museum', 'exhibition', 'art', 'festival'],

    desc:'超级树灯光秀国庆特别版。每场约15分钟。',
    image:'https://www.gardensbythebay.com.sg/content/dam/gbb-2021/image/things-to-do/events/garden-rhapsody/gr-masthead-1920x1080.jpg', link:'https://www.gardensbythebay.org.sg', source:'Gardens by the Bay' },
];

// ============================================================
//  动态数据加载（从 events.json 读取，失败则回退到内置数据）
// ============================================================
let ALL_EVENTS = BUILTIN_EVENTS;
let WEEK_DATES = BUILTIN_WEEK_DATES;
let USER_PREFS_DYNAMIC = null;
let lastUpdated = null;

function generateWeekDates() {
  const days = [];
  const today = new Date();
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  for (let i = 0; i < 8; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    const dateStr = `${y}-${m}-${day}`;
    const label = i === 0 ? '今天' : i === 1 ? '明天' : weekdays[d.getDay()];
    const short = `${parseInt(m)}/${parseInt(day)} ${weekdays[d.getDay()]}`;
    days.push({ date: dateStr, label, short });
  }
  return days;
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

async function loadData() {
  try {
    const res = await fetch('events.json?v=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.events && data.events.length > 0) {
      ALL_EVENTS = data.events;
      lastUpdated = data.lastUpdated;
      // 始终使用真实今天生成的 7 天日期，避免服务端静态 weekDates 导致“今天”不更新
      WEEK_DATES = generateWeekDates();
      if (data.userPrefs) USER_PREFS_DYNAMIC = data.userPrefs;
      const badge = document.getElementById('updateBadge');
      if (badge && lastUpdated) {
        const d = new Date(lastUpdated);
        const m = d.getMonth() + 1;
        const day = d.getDate();
        const hh = String(d.getHours()).padStart(2,'0');
        const mm = String(d.getMinutes()).padStart(2,'0');
        badge.textContent = `🔄 ${m}/${day} ${hh}:${mm}更新`;
        badge.style.display = '';
      }
      console.log(`[SG Events] Loaded ${ALL_EVENTS.length} events from events.json`);
    }
  } catch (e) {
    console.log('[SG Events] Using embedded data:', e.message);
  }
}

// ============================================================
//  推荐引擎：根据用户偏好评分筛选
// ============================================================
function getPrefs() { return USER_PREFS_DYNAMIC || USER_PREFS; }

function scoreEvent(e) {
  let score = 0;
  const prefs = getPrefs();
  const catScore = prefs.categoryScores[e.category] || 0;
  score += catScore * 3;
  if (e.price === 'free') score += 3;
  else if (e.price === 'low') score += 1.5;
  else score -= 1;
  if (e.hot) score += 2;
  score += 0.5;
  return score;
}

function getRecommendations(date) {
  const dayEvents = ALL_EVENTS.filter(e => e.date === date);
  const scored = dayEvents.map(e => ({ ...e, _score: scoreEvent(e) }));
  scored.sort((a, b) => b._score - a._score);
  return scored.slice(0, getPrefs().maxPerDay);
}

function getAllForDay(date) {
  return ALL_EVENTS.filter(e => e.date === date);
}

// ============================================================
//  模式切换：compact（迷你）↔ full（完整页）
//  在原生 App 中，向 Swift 发消息让窗口缩放；
//  在普通浏览器中，仅做页面内切换。
// ============================================================
let mode = 'compact';

function postToNative(action) {
  try {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget) {
      window.webkit.messageHandlers.widget.postMessage({ action: action });
    }
  } catch (e) { /* plain browser — ignore */ }
}

function setMode(m) {
  mode = m;
  document.body.classList.toggle('mode-compact', m === 'compact');
  document.body.classList.toggle('mode-full', m === 'full');
  if (m === 'full') {
    stopCompactTimer();
    currentSlide = 0;
    renderDayTabs();
    renderSlides();
    startAutoPlay();
    postToNative('expand');
  } else {
    stopAutoPlay();
    renderCompact();
    postToNative('collapse');
  }
}

// ============================================================
//  COMPACT 渲染：今日最重要活动的轮播
// ============================================================
let cpIndex = 0;
let cpTimer = null;
const CP_DURATION = 5000;

function renderCompact() {
  const today = getTodayStr();
  const recs = getRecommendations(today);
  const stage = document.getElementById('cpEvents');
  const dotsEl = document.getElementById('cpDots');

  const dayInfo = WEEK_DATES.find(d => d.date === today);
  const [m, d] = today.split('-').slice(1).map(n => parseInt(n));
  document.getElementById('cpDate').textContent =
    `${dayInfo ? dayInfo.label + ' · ' : ''}${m}/${d}`;

  if (recs.length === 0) {
    stage.innerHTML = `<div class="cp-event active" style="justify-content:center;color:rgba(255,255,255,0.4);font-size:12px;">今日暂无推荐 🌙</div>`;
    dotsEl.innerHTML = '';
    return;
  }

  stage.innerHTML = recs.map((e, i) => {
    const cat = CAT_META[e.category] || CAT_META.music;
    return `
    <div class="cp-event ${i === 0 ? 'active' : ''}">
      <div class="cp-body">
        <div class="cp-cat">${cat.label}</div>
        <div class="cp-title" title="${e.title}">${e.title}</div>
        <div class="cp-row"><span class="ico">🕐</span><span>${e.time}</span></div>
        <div class="cp-row"><span class="ico">📍</span><span>${e.location}</span></div>
      </div>
    </div>`;
  }).join('');

  dotsEl.innerHTML = recs.map((_, i) =>
    `<div class="cp-dot ${i === 0 ? 'active' : ''}" data-idx="${i}"></div>`
  ).join('');
  dotsEl.querySelectorAll('.cp-dot').forEach(dot => {
    dot.addEventListener('click', (ev) => {
      ev.stopPropagation();
      cpGoTo(parseInt(dot.dataset.idx));
      startCompactTimer();
    });
  });

  cpIndex = 0;
  updateCompactLeft(recs[0]);
  startCompactTimer();
}

function updateCompactLeft(e) {
  const cat = CAT_META[e.category] || CAT_META.music;
  const left = document.getElementById('cpLeft');
  const icon = document.getElementById('cpIcon');
  const price = document.getElementById('cpPrice');
  if (e.image) {
    left.style.backgroundImage = `url("${e.image}")`;
    left.classList.add('has-image');
  } else {
    left.classList.remove('has-image');
    left.style.backgroundImage = 'none';
    left.style.background = `linear-gradient(135deg, ${cat.grad[0]}, ${cat.grad[1]})`;
  }
  icon.textContent = cat.icon;
  price.textContent = e.priceText;
  if (e.hot && !document.getElementById('cpHot')) {
    const hot = document.createElement('span');
    hot.id = 'cpHot';
    hot.className = 'cp-hot-h';
    hot.textContent = '🔥 热门';
    left.appendChild(hot);
  } else if (!e.hot) {
    document.getElementById('cpHot')?.remove();
  }
}

function cpGoTo(idx) {
  const events = document.querySelectorAll('.cp-event');
  const dots = document.querySelectorAll('.cp-dot');
  const recs = getRecommendations(getTodayStr());
  if (events.length === 0) return;
  cpIndex = ((idx % events.length) + events.length) % events.length;
  events.forEach((s, i) => s.classList.toggle('active', i === cpIndex));
  dots.forEach((d, i) => d.classList.toggle('active', i === cpIndex));
  updateCompactLeft(recs[cpIndex]);
}

function startCompactTimer() {
  clearInterval(cpTimer);
  cpTimer = setInterval(() => cpGoTo(cpIndex + 1), CP_DURATION);
}
function stopCompactTimer() { clearInterval(cpTimer); }

// 点击迷你卡片 → 展开完整页
document.getElementById('compactView').addEventListener('click', () => {
  if (mode === 'compact') setMode('full');
});

// 紧凑模式左右翻页按钮
document.getElementById('cpPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  cpGoTo(cpIndex - 1);
  startCompactTimer();
});
document.getElementById('cpNext').addEventListener('click', (e) => {
  e.stopPropagation();
  cpGoTo(cpIndex + 1);
  startCompactTimer();
});

// ============================================================
//  FULL 渲染（原有完整页逻辑）
// ============================================================
let currentDate = getTodayStr();
let currentSlide = 0;
let autoTimer = null;
let progressTimer = null;
const SLIDE_DURATION = 6000; // 6 seconds per slide

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = WEEK_DATES.map(d =>
    `<button class="day-tab ${d.date === currentDate ? 'active' : ''}" data-date="${d.date}">${d.short}</button>`
  ).join('');
  container.querySelectorAll('.day-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentDate = btn.dataset.date;
      currentSlide = 0;
      renderDayTabs();
      renderSlides();
      startAutoPlay();
    });
  });
}

function renderSlides() {
  const recs = getRecommendations(currentDate);
  const slidesEl = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');

  if (recs.length === 0) {
    slidesEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(255,255,255,0.4);font-size:13px;">今日暂无推荐活动 🌙</div>`;
    dotsEl.innerHTML = '';
    return;
  }

  slidesEl.innerHTML = recs.map((e, i) => {
    const cat = CAT_META[e.category] || CAT_META.music;
    const priceClass = e.price === 'free' ? 'badge-price-free' : e.price === 'low' ? 'badge-price-low' : 'badge-price-paid';
    const visualStyle = e.image
      ? `background-image: url('${e.image}')`
      : `background: linear-gradient(135deg, ${cat.grad[0]}, ${cat.grad[1]})`;
    const visualInner = e.image
      ? ''
      : `<div class="slide-pattern"></div>
         <div class="slide-icon">${cat.icon}</div>`;
    return `
    <div class="slide ${i === 0 ? 'active' : ''}" data-idx="${i}">
      <div class="slide-visual ${e.image ? 'has-image' : ''}" style="${visualStyle}">
        ${visualInner}
      </div>
      <div class="slide-content">
        <div class="slide-badges">
          <span class="badge badge-cat">${cat.label}</span>
          <span class="badge ${priceClass}">${e.priceText}</span>
          ${e.hot ? '<span class="badge badge-hot">🔥 热门</span>' : ''}
        </div>
        <div class="slide-title">${e.title}</div>
        <div class="slide-info">
          <div class="info-row"><span class="info-icon">🕐</span><span>${e.time}</span></div>
          <div class="info-row"><span class="info-icon">📍</span><span>${e.location}</span></div>
        </div>
        <div class="slide-desc">${e.desc}</div>
        <a class="slide-link" href="${e.link}" target="_blank" rel="noopener">🔗 ${e.source} → 查看官网</a>
      </div>
    </div>`;
  }).join('');

  dotsEl.innerHTML = recs.map((_, i) =>
    `<div class="dot ${i === 0 ? 'active' : ''}" data-idx="${i}"></div>`
  ).join('');

  dotsEl.querySelectorAll('.dot').forEach(dot => {
    dot.addEventListener('click', () => goToSlide(parseInt(dot.dataset.idx)));
  });

  // Update date label
  const dayInfo = WEEK_DATES.find(d => d.date === currentDate);
  const [m, d] = currentDate.split('-').slice(1).map(n => parseInt(n));
  document.getElementById('dateLabel').textContent = `${m}月${d}日 ${dayInfo ? dayInfo.label : ''}`;
}

function goToSlide(idx) {
  const slides = document.querySelectorAll('.slide');
  const dots = document.querySelectorAll('.dot');
  if (slides.length === 0) return;
  currentSlide = ((idx % slides.length) + slides.length) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
  dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
  resetProgress();
}

function nextSlide() { goToSlide(currentSlide + 1); }
function prevSlide() { goToSlide(currentSlide - 1); }

function startAutoPlay() {
  clearInterval(autoTimer);
  clearInterval(progressTimer);
  resetProgress();
  let elapsed = 0;
  progressTimer = setInterval(() => {
    elapsed += 50;
    const pct = Math.min(100, (elapsed / SLIDE_DURATION) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
  }, 50);
  autoTimer = setInterval(() => {
    nextSlide();
  }, SLIDE_DURATION);
}

function stopAutoPlay() {
  clearInterval(autoTimer);
  clearInterval(progressTimer);
}

function resetProgress() {
  document.getElementById('progressBar').style.width = '0%';
  clearInterval(progressTimer);
  let elapsed = 0;
  progressTimer = setInterval(() => {
    elapsed += 50;
    const pct = Math.min(100, (elapsed / SLIDE_DURATION) * 100);
    document.getElementById('progressBar').style.width = pct + '%';
    if (pct >= 100) {
      clearInterval(progressTimer);
    }
  }, 50);
}

// Nav arrows
document.getElementById('navNext').addEventListener('click', (e) => {
  e.stopPropagation();
  nextSlide();
  startAutoPlay();
});
document.getElementById('navPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  prevSlide();
  startAutoPlay();
});

// Pause on hover
document.getElementById('carousel').addEventListener('mouseenter', () => {
  clearInterval(autoTimer);
  clearInterval(progressTimer);
});
document.getElementById('carousel').addEventListener('mouseleave', () => {
  startAutoPlay();
});

// Touch/swipe support
let touchStartX = 0;
document.getElementById('carousel').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
});
document.getElementById('carousel').addEventListener('touchend', (e) => {
  const diff = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(diff) > 40) {
    if (diff > 0) prevSlide(); else nextSlide();
    startAutoPlay();
  }
});

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { prevSlide(); startAutoPlay(); }
  if (e.key === 'ArrowRight') { nextSlide(); startAutoPlay(); }
  if (e.key === 'Escape' && mode === 'full') setMode('compact');
});

// Collapse back to mini widget
document.getElementById('collapseBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  setMode('compact');
});

// Expanded view (all events of the day)
document.getElementById('expandBtn').addEventListener('click', () => {
  const all = getAllForDay(currentDate);
  const dayInfo = WEEK_DATES.find(d => d.date === currentDate);
  document.getElementById('expandedTitle').textContent = `${dayInfo ? dayInfo.label : ''} · 全部 ${all.length} 项活动`;
  document.getElementById('expandedList').innerHTML = all.map(e => {
    const cat = CAT_META[e.category] || CAT_META.music;
    const priceClass = e.price === 'free' ? 'badge-price-free' : e.price === 'low' ? 'badge-price-low' : 'badge-price-paid';
    return `
    <a class="exp-item" href="${e.link}" target="_blank" rel="noopener">
      <div class="exp-item-top">
        <div class="exp-item-title">${cat.icon} ${e.title}</div>
        <span class="badge ${priceClass}" style="flex-shrink:0;">${e.priceText}</span>
      </div>
      <div class="exp-item-meta">🕐 ${e.time} · 📍 ${e.location}</div>
    </a>`;
  }).join('');
  document.getElementById('expandedOverlay').classList.add('show');
});
document.getElementById('closeExpanded').addEventListener('click', () => {
  document.getElementById('expandedOverlay').classList.remove('show');
});
document.getElementById('expandedOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'expandedOverlay') {
    document.getElementById('expandedOverlay').classList.remove('show');
  }
});

// Init
let _lastKnownToday = getTodayStr();

function refreshIfDateChanged() {
  const today = getTodayStr();
  if (today !== _lastKnownToday) {
    _lastKnownToday = today;
    WEEK_DATES = generateWeekDates();
    currentDate = today;
    if (mode === 'compact') {
      renderCompact();
    } else {
      renderDayTabs();
      renderSlides();
    }
  }
}

async function init() {
  // 默认先用真实日期，避免 loadData 前任何界面用旧静态日期
  WEEK_DATES = generateWeekDates();
  await loadData();
  WEEK_DATES = generateWeekDates(); // 再确认一次
  _lastKnownToday = getTodayStr();
  currentDate = _lastKnownToday;
  // If today's date isn't in WEEK_DATES, use the first available date
  if (!WEEK_DATES.find(d => d.date === currentDate) && WEEK_DATES.length > 0) {
    currentDate = WEEK_DATES[0].date;
  }
  // 每分钟检查一次真实日期是否变化（跨天自动刷新）
  setInterval(refreshIfDateChanged, 60 * 1000);
  // PWA installed on mobile: go straight to full view
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (isStandalone && window.innerWidth <= 500) {
    setMode('full');
  } else {
    document.body.classList.add('mode-compact');
    renderCompact();
  }
}
init();

// Register Service Worker for PWA installability (skip in native Mac app)
if ('serviceWorker' in navigator) {
  const isNativeApp = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.widget);
  if (!isNativeApp) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('[SG Events] Service Worker registered'))
        .catch(err => console.warn('[SG Events] SW registration failed:', err));
    });
  }
}

// PWA install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = '';
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'none';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  const btn = document.getElementById('installBtn');
  if (!deferredPrompt) {
    if (btn) btn.style.display = 'none';
    return;
  }
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  if (btn) btn.style.display = 'none';
});
</script>
